<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Outlook Unsubscribe</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      padding: 24px 20px;
      background: Canvas;
      color: CanvasText;
    }

    main {
      max-width: 560px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 24px;
    }

    #status {
      min-height: 48px;
      margin: 0 0 20px;
      line-height: 1.45;
    }

    .action {
      display: block;
      box-sizing: border-box;
      width: 100%;
      margin: 12px 0;
      padding: 14px 18px;
      border: 0;
      border-radius: 8px;
      background: #0f6cbd;
      color: #fff;
      font: inherit;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    .secondary {
      background: transparent;
      color: CanvasText;
      border: 1px solid GrayText;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <main>
    <h1>Outlook Unsubscribe</h1>
    <p id="status" role="status" aria-live="polite">Looking for an unsubscribe link…</p>
    <a id="linkAction" class="action" href="#" hidden>Open unsubscribe page</a>
    <button id="postAction" class="action" type="button" hidden>Unsubscribe</button>
    <button id="closeAction" class="action secondary" type="button">Close</button>
  </main>
  <script src="mobile.js?v=1.0.0.10"></script>
</body>
</html>
